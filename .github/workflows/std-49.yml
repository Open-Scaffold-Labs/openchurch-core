# STD-49: never send or store a full card number.
# Pin a commit of the shared reusable workflow; do not copy the script.
# See Open-Scaffold-Labs/openscaffold-core/docs/STD-49-NO-RAW-CARD-NUMBERS.md.
name: STD-49 no raw card numbers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-raw-card-numbers:
    uses: Open-Scaffold-Labs/openscaffold-core/.github/workflows/std-49-no-raw-card-numbers.yml@d5dda90c87ee856de847bd79d0f003b46f3a399d
    secrets:
      ecosystem-token: ${{ secrets.OSL_ECOSYSTEM_TOKEN }}
