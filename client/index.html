<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OpenChurch — church management for liturgical congregations: members, scheduling, giving, events, and more." />
    <title>OpenChurch</title>

    <!-- PWA: tells the browser this is an installable app and seeds
         the install banner / OS theme bar. Theme color matches
         Parchment & Brass burgundy (church-600). Manifest itself is
         emitted by vite-plugin-pwa during build. -->
    <meta name="theme-color" content="#7B2D26" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS standalone-mode hints. apple-mobile-web-app-capable lets
         users 'Add to Home Screen' and get a chromeless app shell;
         status-bar-style controls the notch bar's tone. The
         apple-touch-icon is a PNG (iOS doesn't parse SVG here) — drop
         a proper 180x180 in client/public/apple-touch-icon.png before
         public launch; until then iOS falls back to a screenshot. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OpenChurch" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Design-system fonts (Parchment & Brass): Inter for body/UI,
         Cormorant Garamond for serif display headlines (.font-display).
         SELF-HOSTED via @fontsource — imported in src/main.jsx and bundled
         by Vite, deliberately NOT loaded from the Google Fonts CDN.
         A parish office on bad wifi, or a pitch run from a coffee shop with
         no signal, used to fall silently back to Georgia and system-ui and
         lose the identity at exactly the moment it mattered most. The
         typography is part of the product, so it ships with the product. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
